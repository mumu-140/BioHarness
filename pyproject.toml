[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bioharness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.12,<1",
  "rfc8785>=0.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
bioharness = "bioharness.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
